name: Maven Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify shaded plugin contents
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -qx 'plugin.yml'
          jar tf "$jar_file" | grep -qx 'org/sqlite/JDBC.class'
          echo "Verified plugin descriptor and bundled SQLite driver in $jar_file"
      - name: Upload verified plugin JAR
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SuperAuction-plugin
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
