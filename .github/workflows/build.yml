name: Maven Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install PlaceholderAPI API from the official release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/PlaceholderAPI-2.12.2.jar" \
            "https://github.com/PlaceholderAPI/PlaceholderAPI/releases/download/2.12.2/PlaceholderAPI-2.12.2.jar"
          mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$RUNNER_TEMP/PlaceholderAPI-2.12.2.jar" \
            -DgroupId=me.clip -DartifactId=placeholderapi -Dversion=2.12.2 \
            -Dpackaging=jar -DgeneratePom=true
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify shaded plugin contents
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*' | head -n 1)"
          test -n "$jar_file"
          jar tf "$jar_file" | grep -qx 'plugin.yml'
          if jar tf "$jar_file" | grep -q '^org/sqlite/'; then
            echo "Unexpected SQLite classes found in YAML-only plugin JAR" >&2
            exit 1
          fi
          echo "Verified plugin descriptor and absence of bundled database drivers in $jar_file"
      - name: Upload verified plugin JAR
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: SuperAuction-plugin
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
